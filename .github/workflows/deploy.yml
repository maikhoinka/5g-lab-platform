name: CI/CD Pipeline
on:
  push:
    branches: [main]
env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: 5g-lab-platform

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Debug OIDC token
      run: |
        curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
        "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
        python3 -c "import sys,json,base64; token=json.load(sys.stdin)['value'].split('.')[1]; print(json.loads(base64.b64decode(token+'==')))"
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: eu-north-1
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
